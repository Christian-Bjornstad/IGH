[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "igh-merge"
version = "0.2.0"
description = "Lokal desktopapplikasjon for sikker sammenslåing og kontroll av IGHV-SHM-resultater"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "PyQt6>=6.7",
    "reportlab>=4.0",
    "requests>=2.32",
    "truststore>=0.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[project.scripts]
igh-merge = "igh_merge.cli:main"
igh-prosess = "igh_merge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
